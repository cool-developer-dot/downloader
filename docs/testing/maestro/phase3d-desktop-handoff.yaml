appId: com.anonymous.vidorax
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Skip"
    timeout: 45000
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Open YouTube"
    timeout: 45000
- takeScreenshot: H00-home
- tapOn: "Open YouTube"
- extendedWaitUntil:
    visible: ".*youtube.com.*"
    timeout: 60000
- takeScreenshot: H01-youtube
- tapOn: "Open browser menu"
- assertVisible: "Desktop site"
- takeScreenshot: H01-menu-off
- tapOn: "Request desktop version of current site"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Desktop site"
    timeout: 20000
- takeScreenshot: H02-menu-desktop-on
- tapOn:
    point: "20%,40%"
- extendedWaitUntil:
    visible: "Open browser menu"
    timeout: 20000
- takeScreenshot: H02-page-desktop
- tapOn: "Open browser menu"
- tapOn: "Request desktop version of current site"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Desktop site"
    timeout: 20000
- takeScreenshot: H03-menu-desktop-off
- tapOn:
    point: "20%,40%"
# New tab B — mobile
- tapOn: "Open browser menu"
- tapOn: "New tab"
- extendedWaitUntil:
    visible: "Open YouTube"
    timeout: 20000
- takeScreenshot: H04-new-tab
- tapOn: "Home tab"
- extendedWaitUntil:
    visible: "Open Instagram"
    timeout: 20000
- tapOn: "Open Instagram"
- extendedWaitUntil:
    visible: "Open browser menu"
    timeout: 60000
- tapOn: "Open browser menu"
- takeScreenshot: H04-tabB-menu-should-be-off
- tapOn:
    point: "20%,40%"
- tapOn: "Open tab switcher"
- takeScreenshot: H05-switcher
# Switch back to YouTube tab if listed
- back
# TikTok
- tapOn: "Home tab"
- tapOn: "Open TikTok"
- extendedWaitUntil:
    visible: "Open browser menu"
    timeout: 90000
- takeScreenshot: H15-tiktok
- tapOn: "Open browser menu"
- takeScreenshot: H15-menu
- tapOn: "Request desktop version of current site"
- waitForAnimationToEnd
- takeScreenshot: H16-tiktok-desktop-menu
- tapOn: "Open tab switcher"
- takeScreenshot: H19-switcher-final
