plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.vidorax'
version = '1.0.0'

android {
  namespace "com.vidorax.web"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // RNCWebViewHooks is added to react-native-webview by scripts/patch-react-native-webview.js.
  implementation project(':react-native-webview')
  // The version react-native-webview compiles against (webkitVersion in its gradle.properties).
  implementation "androidx.webkit:webkit:1.14.0"

  testImplementation "junit:junit:4.13.2"
}
