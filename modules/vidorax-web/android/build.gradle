plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.vidorax'
version = '1.0.0'

android {
  namespace "com.vidorax.web"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // RNCWebViewHooks is added to react-native-webview by scripts/patch-react-native-webview.js.
  implementation project(':react-native-webview')
  // B20: WebView profiles (ProfileStore). The same version react-native-webview uses (its gradle.properties), so the
  // APK still has one androidx.webkit.
  implementation "androidx.webkit:webkit:1.14.0"
  // B22 #30: Google code scanner (Play services shows the camera; no CAMERA permission in this app).
  implementation "com.google.android.gms:play-services-code-scanner:16.1.0"

  testImplementation "junit:junit:4.13.2"
  // B1: real android.graphics Bitmap/JPEG for the tab-preview snapshot test (same version as vidorax-media).
  testImplementation "org.robolectric:robolectric:4.16.1"
}
